name: Diagnose Model Bot token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-model:
    name: Isolated Model Bot API test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test Model Bot token with independent HTTP clients
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
        run: |
          set -u
          if [ -z "${MODEL_BOT_TOKEN:-}" ]; then
            echo "MODEL_BOT_TOKEN is missing or empty."
            exit 1
          fi

          echo "Test 1/3: Node fetch getMe (25-second timeout)"
          MODEL_BOT_TOKEN="$MODEL_BOT_TOKEN" node <<'NODE'
          const token = process.env.MODEL_BOT_TOKEN;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 25000);
          const started = Date.now();
          try {
            const response = await fetch(`https://api.telegram.org/bot${token}/getMe`, {
              signal: controller.signal,
              headers: { accept: "application/json" }
            });
            const body = await response.json().catch(() => null);
            console.log(JSON.stringify({
              test: "node_fetch_getMe",
              httpStatus: response.status,
              elapsedMs: Date.now() - started,
              telegramOk: body?.ok ?? null,
              telegramErrorCode: body?.error_code ?? null,
              description: body?.description ?? null,
              username: body?.result?.username ?? null
            }));
          } catch (error) {
            console.log(JSON.stringify({
              test: "node_fetch_getMe",
              error: error?.name === "AbortError" ? "TIMEOUT" : "NETWORK_ERROR",
              errorType: error?.name ?? "UnknownError",
              elapsedMs: Date.now() - started
            }));
          } finally {
            clearTimeout(timer);
          }
          NODE

          echo "Test 2/3: curl getMe (25-second timeout)"
          curl --silent --show-error --max-time 25 \
            --output /tmp/model-getme.json \
            --write-out 'curl_http_status=%{http_code} elapsed_seconds=%{time_total}\n' \
            "https://api.telegram.org/bot${MODEL_BOT_TOKEN}/getMe" || echo "curl_exit_code=$?"

          node <<'NODE'
          const fs = require("node:fs");
          try {
            const body = JSON.parse(fs.readFileSync("/tmp/model-getme.json", "utf8"));
            console.log(JSON.stringify({
              test: "curl_getMe_body",
              telegramOk: body?.ok ?? null,
              telegramErrorCode: body?.error_code ?? null,
              description: body?.description ?? null,
              username: body?.result?.username ?? null
            }));
          } catch {
            console.log(JSON.stringify({test: "curl_getMe_body", result: "NO_VALID_JSON_BODY"}));
          }
          NODE

          echo "Test 3/3: getWebhookInfo (only if token can authenticate)"
          MODEL_BOT_TOKEN="$MODEL_BOT_TOKEN" node <<'NODE'
          const token = process.env.MODEL_BOT_TOKEN;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 20000);
          const started = Date.now();
          try {
            const response = await fetch(`https://api.telegram.org/bot${token}/getWebhookInfo`, {
              signal: controller.signal,
              headers: { accept: "application/json" }
            });
            const body = await response.json().catch(() => null);
            const result = body?.result ?? {};
            console.log(JSON.stringify({
              test: "node_fetch_getWebhookInfo",
              httpStatus: response.status,
              elapsedMs: Date.now() - started,
              telegramOk: body?.ok ?? null,
              telegramErrorCode: body?.error_code ?? null,
              description: body?.description ?? null,
              webhookUrl: result.url || null,
              pendingUpdateCount: result.pending_update_count ?? null,
              lastErrorDate: result.last_error_date ?? null,
              lastErrorMessage: result.last_error_message ?? null
            }));
          } catch (error) {
            console.log(JSON.stringify({
              test: "node_fetch_getWebhookInfo",
              error: error?.name === "AbortError" ? "TIMEOUT" : "NETWORK_ERROR",
              errorType: error?.name ?? "UnknownError",
              elapsedMs: Date.now() - started
            }));
          } finally {
            clearTimeout(timer);
          }
          NODE
