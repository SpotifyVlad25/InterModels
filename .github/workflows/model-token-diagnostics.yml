name: Diagnose Model Bot token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-model:
    name: Isolated Model Bot API test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect token shape and test alternate network paths
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
        run: |
          set -u
          if [ -z "${MODEL_BOT_TOKEN:-}" ]; then
            echo "MODEL_BOT_TOKEN is missing or empty."
            exit 1
          fi

          echo "Test 1: token shape only (secret value is never printed)"
          MODEL_BOT_TOKEN="$MODEL_BOT_TOKEN" node <<'NODE'
          const raw = process.env.MODEL_BOT_TOKEN;
          const trimmed = raw.trim();
          console.log(JSON.stringify({
            test: "token_shape",
            rawLength: raw.length,
            trimmedLength: trimmed.length,
            hasLeadingOrTrailingWhitespace: raw !== trimmed,
            hasAnyWhitespace: /\s/.test(raw),
            matchesTelegramTokenShape: /^\d+:[A-Za-z0-9_-]+$/.test(trimmed),
            numericIdPartLength: trimmed.split(":")[0]?.length ?? 0
          }));
          NODE

          echo "Test 2: curl over IPv4 using trimmed token (30-second timeout)"
          MODEL_BOT_TOKEN="$MODEL_BOT_TOKEN" node -e 'process.stdout.write(process.env.MODEL_BOT_TOKEN.trim())' > /tmp/model-token
          TOKEN="$(cat /tmp/model-token)"
          curl -4 --silent --show-error --max-time 30 \
            --output /tmp/model-ipv4.json \
            --write-out 'ipv4_http_status=%{http_code} elapsed_seconds=%{time_total}\n' \
            "https://api.telegram.org/bot${TOKEN}/getMe" || echo "ipv4_curl_exit_code=$?"
          node -e 'try { const x=require("/tmp/model-ipv4.json"); console.log(JSON.stringify({test:"ipv4_body",ok:x.ok??null,errorCode:x.error_code??null,description:x.description??null,username:x.result?.username??null})); } catch { console.log(JSON.stringify({test:"ipv4_body",result:"NO_VALID_JSON"})); }'

          echo "Test 3: curl over IPv6 using trimmed token (20-second timeout)"
          curl -6 --silent --show-error --max-time 20 \
            --output /tmp/model-ipv6.json \
            --write-out 'ipv6_http_status=%{http_code} elapsed_seconds=%{time_total}\n' \
            "https://api.telegram.org/bot${TOKEN}/getMe" || echo "ipv6_curl_exit_code=$?"
          node -e 'try { const x=require("/tmp/model-ipv6.json"); console.log(JSON.stringify({test:"ipv6_body",ok:x.ok??null,errorCode:x.error_code??null,description:x.description??null,username:x.result?.username??null})); } catch { console.log(JSON.stringify({test:"ipv6_body",result:"NO_VALID_JSON"})); }'

          echo "Test 4: POST getMe over IPv4 (20-second timeout)"
          curl -4 --silent --show-error --max-time 20 --request POST \
            --output /tmp/model-post.json \
            --write-out 'post_http_status=%{http_code} elapsed_seconds=%{time_total}\n' \
            "https://api.telegram.org/bot${TOKEN}/getMe" || echo "post_curl_exit_code=$?"
          node -e 'try { const x=require("/tmp/model-post.json"); console.log(JSON.stringify({test:"post_body",ok:x.ok??null,errorCode:x.error_code??null,description:x.description??null,username:x.result?.username??null})); } catch { console.log(JSON.stringify({test:"post_body",result:"NO_VALID_JSON"})); }'

          echo "Test 5: control request using Director Bot token over IPv4"
          DIRECTOR_TOKEN="$(printf '%s' "${DIRECTOR_BOT_TOKEN:-}" | tr -d '\r\n')"
          if [ -n "$DIRECTOR_TOKEN" ]; then
            curl -4 --silent --show-error --max-time 15 \
              --output /tmp/director-control.json \
              --write-out 'director_http_status=%{http_code} elapsed_seconds=%{time_total}\n' \
              "https://api.telegram.org/bot${DIRECTOR_TOKEN}/getMe" || echo "director_curl_exit_code=$?"
            node -e 'try { const x=require("/tmp/director-control.json"); console.log(JSON.stringify({test:"director_control",ok:x.ok??null,username:x.result?.username??null})); } catch { console.log(JSON.stringify({test:"director_control",result:"NO_VALID_JSON"})); }'
          else
            echo "Director control token is missing."
          fi
