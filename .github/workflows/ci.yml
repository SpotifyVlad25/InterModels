name: InterModels CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Verify D1 migrations locally
        run: npx wrangler d1 migrations apply intermodels-db --local
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run
