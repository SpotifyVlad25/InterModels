name: Deploy InterModels Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-intermodels
  cancel-in-progress: true

jobs:
  deploy:
    name: Migrate database and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Worker
        run: npm run typecheck

      - name: Verify Telegram bot identities
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const bots = [
            ["MODEL_BOT_TOKEN", process.env.MODEL_BOT_TOKEN],
            ["DIRECTOR_BOT_TOKEN", process.env.DIRECTOR_BOT_TOKEN],
            ["SECRETARY_BOT_TOKEN", process.env.SECRETARY_BOT_TOKEN],
          ];
          const identities = [];
          for (const [label, token] of bots) {
            if (!token) throw new Error(`Missing ${label}`);
            const response = await fetch(`https://api.telegram.org/bot${token}/getMe`);
            const data = await response.json();
            if (!data.ok || !data.result?.username) {
              throw new Error(`Telegram getMe failed for ${label}`);
            }
            const username = data.result.username;
            console.log(`${label} = @${username}`);
            identities.push([label, username.toLowerCase()]);
          }
          const expected = [
            ["MODEL_BOT_TOKEN", "intermodels_model_bot"],
            ["DIRECTOR_BOT_TOKEN", "intermodels_director_bot"],
            ["SECRETARY_BOT_TOKEN", "intermodels_bot"],
          ];
          for (const [label, username] of expected) {
            const actual = identities.find(([key]) => key === label)?.[1];
            if (actual !== username) {
              throw new Error(`${label} must belong to @${username}. Deployment stopped before changing production.`);
            }
          }
          if (new Set(identities.map(([, username]) => username)).size !== 3) {
            throw new Error("The three bot token secrets must belong to three different Telegram bots. Deployment stopped.");
          }
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply intermodels-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Worker secrets
        shell: bash
        run: |
          for name in MODEL_BOT_TOKEN DIRECTOR_BOT_TOKEN SECRETARY_BOT_TOKEN MODEL_WEBHOOK_SECRET DIRECTOR_WEBHOOK_SECRET SECRETARY_WEBHOOK_SECRET OWNER_TELEGRAM_ID DIRECTOR_TELEGRAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          node -e 'process.stdout.write(JSON.stringify({
            MODEL_BOT_TOKEN: process.env.MODEL_BOT_TOKEN,
            DIRECTOR_BOT_TOKEN: process.env.DIRECTOR_BOT_TOKEN,
            SECRETARY_BOT_TOKEN: process.env.SECRETARY_BOT_TOKEN,
            MODEL_WEBHOOK_SECRET: process.env.MODEL_WEBHOOK_SECRET,
            DIRECTOR_WEBHOOK_SECRET: process.env.DIRECTOR_WEBHOOK_SECRET,
            SECRETARY_WEBHOOK_SECRET: process.env.SECRETARY_WEBHOOK_SECRET,
            OWNER_TELEGRAM_ID: process.env.OWNER_TELEGRAM_ID,
            DIRECTOR_TELEGRAM_ID: process.env.DIRECTOR_TELEGRAM_ID
          }))' | npx wrangler secret bulk --name intermodels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
          MODEL_WEBHOOK_SECRET: ${{ secrets.MODEL_WEBHOOK_SECRET }}
          DIRECTOR_WEBHOOK_SECRET: ${{ secrets.DIRECTOR_WEBHOOK_SECRET }}
          SECRETARY_WEBHOOK_SECRET: ${{ secrets.SECRETARY_WEBHOOK_SECRET }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          DIRECTOR_TELEGRAM_ID: ${{ secrets.DIRECTOR_TELEGRAM_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure model Telegram webhook
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          MODEL_WEBHOOK_SECRET: ${{ secrets.MODEL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          expected_url="https://intermodels.spotify-vlad25.workers.dev/webhook/model"
          result="$(curl -fsS -X POST "https://api.telegram.org/bot${MODEL_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$expected_url" \
            --data-urlencode "secret_token=${MODEL_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]')"
          printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok){console.error("Model setWebhook failed:",j.description||"unknown error");process.exit(1)}console.log("Model webhook configured.")})'

      - name: Configure director Telegram webhook
        shell: bash
        env:
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          DIRECTOR_WEBHOOK_SECRET: ${{ secrets.DIRECTOR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          expected_url="https://intermodels.spotify-vlad25.workers.dev/webhook/director"
          result="$(curl -fsS -X POST "https://api.telegram.org/bot${DIRECTOR_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$expected_url" \
            --data-urlencode "secret_token=${DIRECTOR_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')"
          printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok){console.error("Director setWebhook failed:",j.description||"unknown error");process.exit(1)}console.log("Director webhook configured.")})'

      - name: Configure secretary Telegram webhook
        shell: bash
        env:
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
          SECRETARY_WEBHOOK_SECRET: ${{ secrets.SECRETARY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          expected_url="https://intermodels.spotify-vlad25.workers.dev/webhook/secretary"
          info="$(curl -fsS "https://api.telegram.org/bot${SECRETARY_BOT_TOKEN}/getWebhookInfo")"
          printf '%s' "$info" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok)throw new Error("Secretary getWebhookInfo failed");const r=j.result||{};console.log("Secretary webhook diagnostic:",JSON.stringify({url:r.url||null,pending_update_count:r.pending_update_count??null,last_error_date:r.last_error_date??null,last_error_message:r.last_error_message??null,allowed_updates:r.allowed_updates??null,max_connections:r.max_connections??null}))})'
          existing_url="$(printf '%s' "$info" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(2);process.stdout.write(j.result.url||"")})')"
          if [ -n "$existing_url" ] && [ "$existing_url" != "$expected_url" ]; then
            echo "::error::Secretary bot already has a different Telegram webhook configured. Deployment stopped to avoid overwriting it."
            exit 1
          fi
          result="$(curl -fsS -X POST "https://api.telegram.org/bot${SECRETARY_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$expected_url" \
            --data-urlencode "secret_token=${SECRETARY_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')"
          printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok){console.error("Secretary setWebhook failed:",j.description||"unknown error");process.exit(1)}console.log("Secretary webhook configured.")})'

      - name: Clear legacy Telegram commands and menu buttons
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          DIRECTOR_TELEGRAM_ID: ${{ secrets.DIRECTOR_TELEGRAM_ID }}
        run: |
          node <<'NODE'
          const bots = [
            ["MODEL_BOT_TOKEN", process.env.MODEL_BOT_TOKEN],
            ["DIRECTOR_BOT_TOKEN", process.env.DIRECTOR_BOT_TOKEN],
            ["SECRETARY_BOT_TOKEN", process.env.SECRETARY_BOT_TOKEN],
          ];
          const chatIds = [...new Set([process.env.OWNER_TELEGRAM_ID, process.env.DIRECTOR_TELEGRAM_ID].filter(Boolean))];
          async function call(token, method, body, allowMissingChat = false) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!data.ok && allowMissingChat && /(chat|user) not found/i.test(data.description || "")) {
              console.log(`${method}: chat has not started this bot; per-chat reset skipped.`);
              return;
            }
            if (!data.ok) throw new Error(`${method} failed: ${data.description || "unknown Telegram error"}`);
          }
          for (const [label, token] of bots) {
            if (!token) throw new Error(`Missing token: ${label}`);
            await call(token, "deleteMyCommands", {});
            await call(token, "setChatMenuButton", {menu_button:{type:"commands"}});
            for (const chat_id of chatIds) {
              await call(token, "deleteMyCommands", {scope:{type:"chat",chat_id:Number(chat_id)}}, true);
              await call(token, "setChatMenuButton", {chat_id:Number(chat_id),menu_button:{type:"commands"}}, true);
            }
            console.log(`${label}: legacy commands and custom menu buttons cleared.`);
          }
          NODE

      - name: Configure Telegram bot descriptions
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const bots = [
            {
              label: "MODEL_BOT_TOKEN",
              token: process.env.MODEL_BOT_TOKEN,
              description: "Личный бот модели InterModels. Просматривайте свой профиль, заполняйте и обновляйте параметры анкеты, получайте уведомления агентства и поддерживайте свои данные актуальными.",
              short_description: "Личный кабинет модели InterModels: профиль и параметры анкеты."
            },
            {
              label: "DIRECTOR_BOT_TOKEN",
              token: process.env.DIRECTOR_BOT_TOKEN,
              description: "Инструмент директора InterModels для управления агентством: обработка заявок на подключение моделей, контроль базы и статусов анкет, запуск рабочих процессов и просмотр статистики.",
              short_description: "Директор InterModels: заявки, база моделей и управление агентством."
            },
            {
              label: "SECRETARY_BOT_TOKEN",
              token: process.env.SECRETARY_BOT_TOKEN,
              description: "Секретарь InterModels — помощник команды агентства. Обрабатывает фотоанкеты и оригиналы фотографий в теме MODEL BANK, помогает создавать и обновлять композитки в теме КОМПОЗИТКИ. Личный чат предназначен для отдельных задач команды.",
              short_description: "Секретарь InterModels: фотоанкеты, композитки и задачи команды."
            }
          ];
          for (const bot of bots) {
            if (!bot.token) throw new Error(`Missing token: ${bot.label}`);
            if (bot.description.length > 512) throw new Error(`${bot.label}: description exceeds 512 characters`);
            if (bot.short_description.length > 120) throw new Error(`${bot.label}: short description exceeds 120 characters`);
            for (const [method, payload] of [
              ["setMyDescription", { description: bot.description }],
              ["setMyShortDescription", { short_description: bot.short_description }]
            ]) {
              const response = await fetch(`https://api.telegram.org/bot${bot.token}/${method}`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload)
              });
              const data = await response.json();
              if (!data.ok) throw new Error(`${bot.label} ${method} failed: ${data.description || "unknown Telegram error"}`);
            }
            console.log(`${bot.label}: full and short descriptions updated.`);
          }
          NODE

      - name: Verify Telegram webhook routing
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const checks = [
            ["MODEL_BOT_TOKEN", process.env.MODEL_BOT_TOKEN, "/webhook/model"],
            ["DIRECTOR_BOT_TOKEN", process.env.DIRECTOR_BOT_TOKEN, "/webhook/director"],
            ["SECRETARY_BOT_TOKEN", process.env.SECRETARY_BOT_TOKEN, "/webhook/secretary"],
          ];
          for (const [label, token, path] of checks) {
            const response = await fetch(`https://api.telegram.org/bot${token}/getWebhookInfo`);
            const data = await response.json();
            const actual = data.ok ? data.result?.url || "" : "";
            const expected = `https://intermodels.spotify-vlad25.workers.dev${path}`;
            const details = data.ok ? data.result : {};
            console.log(`${label}: webhook status ${JSON.stringify({
              route: actual || null,
              pendingUpdateCount: details.pending_update_count ?? null,
              lastErrorDate: details.last_error_date ?? null,
              lastErrorMessage: details.last_error_message ?? null
            })}`);
            if (actual !== expected) {
              console.error(`${label}: webhook route mismatch (expected ${path}, got ${actual || "none"})`);
              process.exitCode = 1;
            } else {
              console.log(`${label}: webhook route OK (${path})`);
            }
          }
          NODE
