name: Diagnose Telegram API connectivity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare Telegram API access for all three bots
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Telegram API connectivity and bot identities
        shell: bash
        env:
          MODEL_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN }}
          DIRECTOR_BOT_TOKEN: ${{ secrets.DIRECTOR_BOT_TOKEN }}
          SECRETARY_BOT_TOKEN: ${{ secrets.SECRETARY_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const bots = [
            ["MODEL_BOT_TOKEN", process.env.MODEL_BOT_TOKEN, "intermodels_model_bot"],
            ["DIRECTOR_BOT_TOKEN", process.env.DIRECTOR_BOT_TOKEN, "intermodels_director_bot"],
            ["SECRETARY_BOT_TOKEN", process.env.SECRETARY_BOT_TOKEN, "intermodels_bot"],
          ];
          const timeoutMs = 15000;
          async function probe(label, token, expected) {
            if (!token) {
              console.log(JSON.stringify({bot: label, result: "MISSING_SECRET"}));
              return;
            }
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const started = Date.now();
            try {
              const response = await fetch(`https://api.telegram.org/bot${token}/getMe`, {
                signal: controller.signal,
                headers: { "accept": "application/json" }
              });
              const elapsedMs = Date.now() - started;
              let data;
              try { data = await response.json(); } catch { data = null; }
              if (response.ok && data?.ok && data.result?.username) {
                const username = data.result.username.toLowerCase();
                console.log(JSON.stringify({
                  bot: label, result: username === expected ? "OK" : "WRONG_BOT",
                  username: data.result.username, expected, httpStatus: response.status, elapsedMs
                }));
              } else {
                console.log(JSON.stringify({
                  bot: label, result: "TELEGRAM_API_ERROR", httpStatus: response.status,
                  telegramErrorCode: data?.error_code ?? null,
                  description: data?.description ?? "invalid or non-JSON response", elapsedMs
                }));
              }
            } catch (error) {
              console.log(JSON.stringify({
                bot: label, result: error?.name === "AbortError" ? "TIMEOUT" : "NETWORK_ERROR",
                errorType: error?.name ?? "UnknownError", elapsedMs: Date.now() - started
              }));
            } finally {
              clearTimeout(timer);
            }
          }
          async function main() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
              const started = Date.now();
              const response = await fetch("https://api.telegram.org", { method: "GET", signal: controller.signal });
              console.log(JSON.stringify({probe: "telegram_api_tls_http", result: "CONNECTED", httpStatus: response.status, elapsedMs: Date.now() - started}));
            } catch (error) {
              console.log(JSON.stringify({probe: "telegram_api_tls_http", result: error?.name === "AbortError" ? "TIMEOUT" : "NETWORK_ERROR", errorType: error?.name ?? "UnknownError"}));
            } finally {
              clearTimeout(timer);
            }
            await Promise.all(bots.map(([label, token, expected]) => probe(label, token, expected)));
          }
          main().catch(error => { console.error("Diagnostic failed:", error?.name ?? "UnknownError"); process.exit(1); });
          NODE
